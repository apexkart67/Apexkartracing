name: Deploy game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack game
        run: unzip -q apex-kart-source.zip -d extracted

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build game
        working-directory: extracted/apex-kart
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: extracted/apex-kart/dist

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
